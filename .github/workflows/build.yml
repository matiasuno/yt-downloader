name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller ytdownloader.spec --distpath dist --workpath build -y
      - name: Zip
        run: cd dist && zip -r --symlinks ../YTDownloader-macOS.zip YTDownloader.app
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-macOS
          path: YTDownloader-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller ytdownloader.spec --distpath dist --workpath build -y
      - name: Zip
        run: Compress-Archive -Path dist\YTDownloader -DestinationPath YTDownloader-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows
          path: YTDownloader-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
